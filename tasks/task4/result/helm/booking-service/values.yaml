replicaCount: 1

image:
  name: hotelio-booking-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    http:
      port: 5000
      targetPort: 5000
    grpc:
      port: 8080
      targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

env: []

features:
  kafka_publish: "true"

postgres:
  host: "host.docker.internal"
  port: 5433
  database: "booking-db"
  username: "booking"
  password: "booking"

kafka:
  host: "host.docker.internal"
  port: 9092

integrations:
  hotelsUrl: "http://host.docker.internal:8084/api/hotels/"
  reviewsUrl: "http://host.docker.internal:8084/api/reviews/"
  promoCodesUrl: "http://host.docker.internal:8084/api/promos/"
  usersUrl: "http://host.docker.internal:8084/api/users/"

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /alive
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 6
