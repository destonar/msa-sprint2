name: Hotelio.Booking.Task4
services:
  monolith:
    build:
      context: ../../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: host.docker.internal
      BOOKING_SERVICE_EXTERNAL_PORT: 9090

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    hostname: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net
  booking-db:
    image: postgres:15
    container_name: booking-db
    environment:
      POSTGRES_USER: ${BOOKING_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
      POSTGRES_DB: ${BOOKING_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - booking-infra-net

  booking-migrator:
    image: hotelio-booking-migrator
    container_name: booking-migrator
    environment:
      ConnectionStrings__booking_db: Host=booking-db;Database=${BOOKING_DB_NAME};User ID=${BOOKING_DB_USER};Password=${BOOKING_DB_PASSWORD};
    env_file:
      - .env
    depends_on:
      booking-db:
        condition: service_healthy
    networks:
      - booking-infra-net

  booking-statistics-db:
    image: postgres:15
    container_name: booking-statistics-db
    environment:
      POSTGRES_USER: ${BOOKING_STATISTICS_DB_USER}
      POSTGRES_PASSWORD: ${BOOKING_STATISTICS_DB_PASSWORD}
      POSTGRES_DB: ${BOOKING_STATISTICS_DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "5434:5432"
    env_file:
      - .env
    volumes:
      - booking-statistics-db-data:/var/lib/postgresql/data
    networks:
      - statistic-infra-net

  booking-statistics-migrator:
    image: hotelio-booking-statistics-migrator
    container_name: booking-statistics-migrator
    environment:
      ConnectionStrings__booking_statistics_db: Host=booking-statistics-db;Database=${BOOKING_STATISTICS_DB_NAME};User ID=${BOOKING_STATISTICS_DB_USER};Password=${BOOKING_STATISTICS_DB_PASSWORD};
    env_file:
      - .env
    depends_on:
      booking-statistics-db:
        condition: service_healthy
    networks:
      - statistic-infra-net

  booking-statistics-service:
    image: hotelio-booking-statistics
    container_name: booking-statistics
    ports:
      - "9091:8080"
    env_file:
      - .env
    environment:
      ConnectionStrings__booking_statistics_db: Host=booking-statistics-db;Database=${BOOKING_STATISTICS_DB_NAME};User ID=${BOOKING_STATISTICS_DB_USER};Password=${BOOKING_STATISTICS_DB_PASSWORD};  
    depends_on:
      booking-statistics-migrator:
        condition: service_completed_successfully
    networks:
      - hotelio-net
      - statistic-infra-net

volumes:
  booking-db-data:
  booking-statistics-db-data:
  monolith-db-data:

networks:
  hotelio-net:
    external: true
  booking-infra-net:
  statistic-infra-net:
