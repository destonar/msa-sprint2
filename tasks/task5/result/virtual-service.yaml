apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: booking-service
spec:
  hosts:
    - booking-service
  gateways:
    - booking-gateway
  http:
    - match:
        - headers:
            X-KafkaPublish-Enabled:
              exact: "true"
      name: /v2
      route:
        - destination:
            host: booking-service
            subset: v2
            port:
              number: 5000
          weight: 100
    - route:
        - destination:
            host: booking-service
            subset: v1
            port:
              number: 5000
          weight: 90
        - destination:
            host: booking-service
            subset: v2
            port:
              number: 5000
          weight: 10
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
